spring:
  config:
    import: optional:file:./employee_service/.env[.properties],optional:file:./.env[.properties]
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${TEST_DB:testdb}
    username: ${POSTGRES_USER:user}
    password: ${POSTGRES_PASSWORD:password}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: create-drop
  cloud:
    config:
      enabled: false

  flyway:
    enabled: false

eureka:
  client:
    enabled: false



app:
  kafka:
    group-id: employee-service-consumer
    bootstrap-servers: ${BROKER_HOST:localhost}:${BROKER_PORT:9092}
    schema-registry-url: http://${SCHEMA_REGISTRY_HOST:localhost}:${SCHEMA_REGISTRY_PORT:8081}
    topics:
        employee-created: employee.created
        employee-updated: employee.updated
        employee-deleted: employee.deleted