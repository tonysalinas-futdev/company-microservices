spring:
  cloud:
    config:
      username: ${CLOUD_USERNAME:user}
      password: ${CLOUD_PASSWORD:s3cr3t}
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:employeesdb}
    username: ${POSTGRES_USER:user}
    password: ${POSTGRES_PASSWORD:password}

  flyway:
    enabled: true
    locations: classpath:db/migration

  boot:
    admin:
      client:
        url: ${ADMIN_SERVICE_URL}
        instance:
          service-host-type: ip

app:
  kafka:
    group-id: employee-service-consumer
    bootstrap-servers: ${BROKER_HOST:localhost}:${BROKER_PORT:9092}
    schema-registry-url: http://${SCHEMA_REGISTRY_HOST:localhost}:${SCHEMA_REGISTRY_PORT:8081}
    topics:
      employee-created: employee.created
      employee-updated: employee.updated
      employee-deleted: employee.deleted
server:
  port: ${APPLICATION_PORT:8080}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL}
  instance:
    prefer-ip-address: true


management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

  metrics:
    distribution:
      percentiles-histogram:
        http.server:
          requests: true